---
apiVersion: batch/v1
kind: Job
metadata:
  name: hr-ingestion
  namespace: workplace
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: hr-ingestion
          image: workplace-ingestion:latest
          imagePullPolicy: Never
          env:
            - name: WORKER
              value: hr
          envFrom:
            - configMapRef:
                name: platform-config
