---
apiVersion: batch/v1
kind: Job
metadata:
  name: hr-ingestion
  namespace: workplace
spec:
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hr-ingestion
          image: workplace-ingestion:latest
          imagePullPolicy: Never
          env:
            - name: WORKER
              value: hr
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
