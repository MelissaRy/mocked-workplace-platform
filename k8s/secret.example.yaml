# TEMPLATE — documents the shape of the Secret the workloads expect.
#
# Do not fill this file in and do not commit a populated copy. `k8s/secret.yaml`
# is gitignored for exactly this reason; prefer creating the Secret imperatively
# so the values never land in a file at all:
#
#   kubectl create secret generic platform-secrets \
#     --namespace workplace \
#     --from-literal=PG_DSN='postgresql://USER:PASSWORD@postgres-postgresql.workplace.svc.cluster.local:5432/workplace_db' \
#     --from-literal=NEO4J_PASS='YOUR_NEO4J_PASSWORD'
#
# Note that a Kubernetes Secret is base64-encoded, not encrypted. On a real
# cluster this should be backed by encryption-at-rest and an external manager
# (External Secrets Operator, Vault, or a cloud KMS-backed store) rather than a
# manifest. For this local kind cluster the imperative command above is the
# honest minimum: it keeps credentials out of version control.
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: workplace
type: Opaque
stringData:
  PG_DSN: "postgresql://<user>:<password>@postgres-postgresql.workplace.svc.cluster.local:5432/workplace_db"
  NEO4J_PASS: "<your-neo4j-password>"
