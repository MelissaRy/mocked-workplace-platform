---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workplace-api
  namespace: workplace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workplace-api
  template:
    metadata:
      labels:
        app: workplace-api
    spec:
      containers:
        - name: api
          image: workplace-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: platform-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: workplace-api
  namespace: workplace
spec:
  type: NodePort
  selector:
    app: workplace-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
