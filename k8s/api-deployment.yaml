---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workplace-api
  namespace: workplace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workplace-api
  template:
    metadata:
      labels:
        app: workplace-api
    spec:
      # Nothing in this pod needs a Kubernetes API token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: workplace-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          # Non-sensitive settings from the ConfigMap; credentials from the
          # Secret. Split deliberately — see configmap.yaml.
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The image is read-only at runtime, so anything needing scratch
          # space gets an explicit ephemeral mount.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: workplace-api
  namespace: workplace
spec:
  type: NodePort
  selector:
    app: workplace-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
