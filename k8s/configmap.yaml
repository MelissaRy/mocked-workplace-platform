# Non-sensitive configuration only.
#
# ConfigMaps are stored unencrypted in etcd and are readable by anything with
# namespace read access, so nothing here may be a credential. Connection
# strings and passwords live in the `platform-secrets` Secret instead — see
# secret.example.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: workplace
data:
  NEO4J_URI: "bolt://neo4j.workplace.svc.cluster.local:7687"
  NEO4J_USER: "neo4j"
  N_EMPLOYEES: "1000"
