apiVersion: v1
kind: Service
metadata:
  name: neo4j-nodeport
  namespace: workplace
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: neo4j
  ports:
    - name: browser
      port: 7474
      targetPort: 7474
      nodePort: 30474
    - name: bolt
      port: 7687
      targetPort: 7687
      nodePort: 30687
